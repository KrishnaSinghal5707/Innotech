name: Q-SHIELD Quality Gate

on:
  push:
    branches:
      - main
      - integration
  pull_request:
    branches:
      - main
      - integration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Bytecode compilation & syntax check
        run: |
          python -m py_compile main.py cli_demo.py scan_results.py test_cli.py tls_scanner.py code_scanner.py risk_engine.py adapters.py dashboard.py demo_workflow.py demo_migration.py test_integration.py test_risk_engine.py test_dashboard_api.py test_release_integration.py sample_vulnerable_app/auth.py sample_vulnerable_app/crypto_service.py sample_remediated_app/auth.py sample_remediated_app/crypto_service.py

      - name: Run automated test suite
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
