function QuantumScene({ loading, total, critical, quantum, onDemo }) {

    const canvas = canvasRef.current, ctx = canvas.getContext('2d');

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const resize = new ResizeObserver(() => { const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(); });
    const project = (x,y,z) => {const a=x*Math.cos(rotation)+z*Math.sin(rotation),b=-x*Math.sin(rotation)+z*Math.cos(rotation);const c=y*Math.cos(tilt)-b*Math.sin(tilt),d=y*Math.sin(tilt)+b*Math.cos(tilt);const scale=390/(390+d);return [width/2+a*scale,height/2+c*scale,scale];};
    const color=layer==='quantum'?'197,246,91':layer==='tls'?'100,211,255':'241,168,95';
    const radius=()=>Math.min(width*.31,height*.34);
    function draw(){
      ctx.clearRect(0,0,width,height);const r=radius();
      const glow=ctx.createRadialGradient(width/2,height/2,0,width/2,height/2,r*1.8);glow.addColorStop(0,`rgba(${color},.09)`);glow.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);
      ctx.strokeStyle=`rgba(${color},.10)`;ctx.lineWidth=1;[1.32,1.58].forEach(s=>{ctx.beginPath();ctx.ellipse(width/2,height/2,r*s,r*s*.32,-.35,0,Math.PI*2);ctx.stroke();});
      for(let lat=-4;lat<=4;lat++){ctx.beginPath();for(let i=0;i<=80;i++){let a=i/80*Math.PI*2,b=lat*Math.PI/10,p=project(r*Math.cos(b)*Math.cos(a),r*Math.sin(b),r*Math.cos(b)*Math.sin(a));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.strokeStyle=`rgba(${color},.22)`;ctx.stroke();}
      for(let lon=0;lon<18;lon++){ctx.beginPath();for(let i=0;i<=60;i++){let a=lon/18*Math.PI*2,b=i/60*Math.PI*2,p=project(r*Math.cos(b)*Math.cos(a),r*Math.sin(b),r*Math.cos(b)*Math.sin(a));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.strokeStyle=`rgba(${color},.15)`;ctx.stroke();}
      for(let i=0;i<30;i++){const a=i*2.39996,b=Math.acos(1-2*(i+.5)/30),p=project(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a));ctx.fillStyle=i%7===0?'#ff775f':`rgba(${color},${Math.min(1,p[2]*.7)})`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p[0],p[1],i%7===0?3:1.8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(i%7===0){ctx.strokeStyle='#ff775f66';ctx.beginPath();ctx.arc(p[0],p[1],8,0,Math.PI*2);ctx.stroke();}}
      const s=Math.min(width/500,1);ctx.save();ctx.translate(width/2,height/2);ctx.scale(s,s);ctx.fillStyle='#0c130eef';ctx.strokeStyle=`rgba(${color},.8)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-49);ctx.lineTo(39,-32);ctx.lineTo(33,15);ctx.quadraticCurveTo(24,38,0,52);ctx.quadraticCurveTo(-24,38,-33,15);ctx.lineTo(-39,-32);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle=`rgb(${color})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-7,10,Math.PI,0);ctx.lineTo(10,11);ctx.lineTo(-10,11);ctx.closePath();ctx.stroke();ctx.fillStyle=`rgb(${color})`;ctx.fillRect(-2,0,4,7);ctx.restore();
      ctx.font='9px monospace';ctx.fillStyle='#819177';ctx.fillText(layer.toUpperCase()+' / ILLUSTRATIVE TOPOLOGY',14,height-90);
    }

const RISK_COLORS = {critical:'#ff806c',high:'#efb565',medium:'#7dc8e7',low:'#a8bc9a',info:'#b3a6eb'};
function buildVisualModel(items) {
  const severity = Object.keys(RISK_COLORS).map(name=>({name,count:items.filter(a=>(a.severity||'info').toLowerCase()===name).length}));
  const algorithms = Object.entries(items.reduce((acc,a)=>{const key=a.algorithm||'Unknown';acc[key]=(acc[key]||0)+1;return acc;},{})).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  return {severity,algorithms,sorted:items.map((item,index)=>({item,index})).sort((a,b)=>(Number(b.item.priority)||0)-(Number(a.item.priority)||0))};
}
function VisualIntelligence({data,onSeverity,onAlgorithm,onInspect,onTrack,onReset,sevFilter,activeTab,searchQuery}) {

  const initialUrgent=items.filter(a=>['critical','high'].includes((a.severity||'').toLowerCase())).length;

  const toggle=i=>setPlanned(prev=>prev.includes(i)?prev.filter(x=>x!==i):[...prev,i]);

    const blob=new Blob([JSON.stringify({type:'Q-SHIELD migration planning simulation',note:'Selected actions are planned, not verified fixes. Rescan after implementation.',source_scan:data?.metadata?.scan_finished_at,actions:planned.map(i=>items[i])},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qshield-migration-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

    {filtered&&<div className="intel-filter-notice" aria-live="polite"><span>Evidence filter: <b>{[activeTab!=='all'?activeTab:null,sevFilter!=='all'?sevFilter:null,searchQuery||null].filter(Boolean).join(' / ')}</b><small>Charts show the full scan snapshot.</small></span><a href="#findings-console">View filtered evidence ↓</a></div>}

                        </div>
                      ) : (
                        <p className="text-xs text-slate-500">No certificate parsed or handshake failed.</p>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="p-12 text-center text-slate-500 bg-slate-900 rounded-xl border border-slate-800">
                    No TLS scan was executed for this run. Provide a target hostname above to inspect network TLS/PQC posture.
                  </div>
                )}
              </div>
            )}

            {/* TAB CONTENT 5: Source Code Evidence */}
            {activeTab === 'code' && (
              <div className="space-y-4">
                {scanData?.modules?.code_scanner?.findings?.length > 0 ? (
                  <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div className="p-4 bg-slate-850 border-b border-slate-800 flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-200">Detected Source Code Cryptographic Evidence</span>
                      <span className="text-slate-400">{scanData.modules.code_scanner.findings.length} calls identified</span>
                    </div>
                    <div className="divide-y divide-slate-800">
                      {scanData.modules.code_scanner.findings.map((f, i) => (
                        <div key={i} className="p-4 space-y-2 hover:bg-slate-850/50 transition">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2">
                              <span className="font-mono text-teal-400 font-bold">{f.file_path}:{f.line_number}</span>
                              <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px]">{f.match_type}</span>
                            </div>
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded ${f.quantum_risk === 'CRITICAL_VULNERABLE' ? 'bg-red-500/20 text-red-300' : 'bg-slate-800 text-slate-400'}`}>
                              {f.quantum_risk}
                            </span>
                          </div>
                          <div className="text-xs text-slate-300">
                            Algorithm: <b className="text-teal-300">{f.detected_algorithm}</b> ({f.likely_purpose})
                          </div>
                          <pre className="p-2.5 bg-slate-950 rounded border border-slate-800/80 text-xs font-mono text-slate-300 overflow-x-auto">
                            <code>{f.code_snippet}</code>
                          </pre>
                          {f.migration_advice && (
                            <p className="text-xs text-slate-400">
                              <span className="text-teal-400 font-semibold">Guidance: </span>
                              {f.migration_advice}
                            </p>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="p-12 text-center text-slate-500 bg-slate-900 rounded-xl border border-slate-800">
                    No source code detections found. Provide a local directory or run on sample_vulnerable_app.
                  </div>
                )}
              </div>
            )}
            <footer className="cyber-footer"><a href="#overview">Q-SHIELD <span>↑ BACK TO SURFACE</span></a><p>DISCOVER THE EXPOSURE. DESIGN THE NEXT DEFENSE.</p><span>END OF TRANSMISSION / INNOTECH ’26</span></footer>
          </main>

          {/* Finding Detail Modal / Drawer */}
          {selectedFinding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-5 shadow-2xl">
                {/* Modal Header */}
                <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div className="space-y-1">
                    <div className="flex items-center space-x-2">
                      <span className={`text-xs font-bold uppercase px-2 py-0.5 rounded-full ${SEVERITY_CONFIG[selectedFinding.severity?.toLowerCase()]?.badge || 'bg-slate-700'}`}>
                        {selectedFinding.severity}
                      </span>
                      <span className="text-xs font-mono text-slate-400">Priority: {selectedFinding.priority?.toFixed(1)}/100</span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-100">{selectedFinding.title}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedFinding(null)}
                    className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Body */}
                <div className="space-y-4 text-xs">
                  {/* Asset & Algorithm */}
                  <div className="grid grid-cols-2 gap-3 p-3 bg-slate-950 rounded-lg border border-slate-800 font-mono">
                    <div>
                      <span className="text-slate-500 block">Asset Target:</span>
                      <span className="text-slate-200 font-bold">{selectedFinding.asset}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">Algorithm:</span>
                      <span className="text-teal-400 font-bold">{selectedFinding.algorithm}</span>
                    </div>
                  </div>

                  {/* Cryptographic Rationale */}
                  <div className="space-y-1">
                    <span className="font-semibold text-slate-300">Cryptographic Threat Rationale:</span>
                    <p className="text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 leading-relaxed">
                      {selectedFinding.rationale}
                    </p>
                  </div>

                  <details className="release-evidence"><summary>Evidence & confidence / {selectedFinding.confidence || 'Not supplied'}</summary><p>{selectedFinding.confidence_rationale}</p>{(() => {const finding=selectedFinding._fromComparison?null:scanData?.inventory?.findings?.find(f=>f.id===selectedFinding.finding_id);return finding?<><p>{finding.attributes?.likely_purpose || finding.usage} / {finding.evidence_source}</p><pre>{finding.attributes?.code_snippet || JSON.stringify(finding.attributes, null, 2)}</pre></>:<p>Open the matching scan from history to view its raw observation.</p>;})()}</details>
                  {/* Threat Model */}
                  {selectedFinding.threat_analysis?.details && (
                    <div className="space-y-1">
                      <span className="font-semibold text-slate-300">Threat & Horizon Model (Mosca Theorem):</span>
                      <p className="text-slate-400 bg-slate-950/60 p-2.5 rounded border border-slate-800/80">
                        {selectedFinding.threat_analysis.details}
                      </p>
                    </div>
                  )}

                  {/* Recommendation Card */}
                  <div className="space-y-2 p-4 bg-teal-500/10 border border-teal-500/30 rounded-xl text-teal-200">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-teal-400 text-xs uppercase tracking-wider">
                        Action ({selectedFinding.recommendation?.timeframe?.toUpperCase()}):
                      </span>
                      <span className="px-2 py-0.5 rounded bg-teal-500/20 text-teal-300 text-[10px] font-mono">
                        Migration guidance
                      </span>
                    </div>
                    <p className="font-medium text-slate-100 text-sm">
                      {selectedFinding.recommendation?.action}
                    </p>
                    <p className="text-slate-300 text-xs">
                      <b>Defensible Reason:</b> {selectedFinding.recommendation?.reason}
                    </p>
                    {selectedFinding.recommendation?.alternatives?.length > 0 && (
                      <div className="pt-2 border-t border-teal-500/20">
                        <span className="text-[11px] font-semibold text-teal-400 block mb-1">Recommended Alternatives:</span>
                        <div className="flex flex-wrap gap-1.5">
                          {selectedFinding.recommendation.alternatives.map((alt, i) => (
                            <span key={i} className="px-2 py-0.5 rounded bg-slate-950 text-teal-300 font-mono text-[10px] border border-teal-500/30">
                              {alt}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setSelectedFinding(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition"
                  >
                    Close Inspector
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
