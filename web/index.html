<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-SHIELD | Post-Quantum Cryptographic Migration & DevSecOps Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
              950: '#042f2e',
            },
            quantum: {
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
            },
            conventional: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-slow { animation: pulse-slow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-teal-500 selection:text-white">
  <div id="root">
    <!-- Initial Loading Fallback -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center p-8 bg-slate-900 border border-slate-800 rounded-xl max-w-md shadow-2xl">
        <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-xl font-bold text-slate-200">Initializing Q-SHIELD</h2>
        <p class="text-slate-400 text-xs mt-2">Loading cryptographic risk engine, AST scanner & dashboard...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Severity styling configuration
    const SEVERITY_CONFIG = {
      critical: { bg: 'bg-red-500/10', text: 'text-red-400', border: 'border-red-500/40', badge: 'bg-red-500 text-white' },
      high: { bg: 'bg-orange-500/10', text: 'text-orange-400', border: 'border-orange-500/40', badge: 'bg-orange-500 text-white' },
      medium: { bg: 'bg-sky-500/10', text: 'text-sky-400', border: 'border-sky-500/40', badge: 'bg-sky-500 text-white' },
      low: { bg: 'bg-slate-500/10', text: 'text-slate-400', border: 'border-slate-500/40', badge: 'bg-slate-600 text-white' },
      info: { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/40', badge: 'bg-emerald-600 text-white' },
    };

    function App() {
      // Main view navigation: 'scanners' | 'matrix' | 'cbom' | 'roadmap' | 'history'
      const [currentView, setCurrentView] = useState('scanners');

      // Scanner flow selection: 'repo' | 'tls' | 'combined'
      const [scanFlow, setScanFlow] = useState('repo');

      // Scan form inputs
      const [host, setHost] = useState('');
      const [port, setPort] = useState(443);
      const [repo, setRepo] = useState('sample_vulnerable_app');
      const [scenario, setScenario] = useState('central');
      const [deepTls, setDeepTls] = useState(false);
      const [ignoreComments, setIgnoreComments] = useState(false);
      const [quantumOnly, setQuantumOnly] = useState(false);

      // Runtime & data states
      const [loading, setLoading] = useState(false);
      const [loadingStep, setLoadingStep] = useState('');
      const [scanData, setScanData] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const [scanHistory, setScanHistory] = useState([]);
      const [historyLoading, setHistoryLoading] = useState(false);

      // Filtering states for Risk Matrix
      const [matrixTab, setMatrixTab] = useState('all'); // 'all', 'quantum', 'conventional'
      const [sevFilter, setSevFilter] = useState('all');
      const [confFilter, setConfFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // Detail Drawer State
      const [selectedFinding, setSelectedFinding] = useState(null);

      // Before / After Comparison state
      const [compareBaselineId, setCompareBaselineId] = useState('');
      const [compareTargetId, setCompareTargetId] = useState('');
      const [comparisonResult, setComparisonResult] = useState(null);
      const [comparing, setComparing] = useState(false);

      // Fetch scan history from backend
      const loadHistory = useCallback(async () => {
        setHistoryLoading(true);
        try {
          const res = await fetch('/api/history');
          if (res.ok) {
            const data = await res.json();
            setScanHistory(data.history || []);
          }
        } catch (e) {
          console.warn('Failed to load history:', e);
        } finally {
          setHistoryLoading(false);
        }
      }, []);

      // Load initial demo data on startup
      useEffect(() => {
        handleLoadDemo();
        loadHistory();
      }, [loadHistory]);

      // Run scan execution
      const handleRunScan = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setErrorMessage(null);
        setLoadingStep('Validating authorized target and configuration...');

        try {
          // Determine payload based on active scanFlow
          let scanType = 'auto';
          let targetHost = host.trim() || null;
          let targetRepo = repo.trim() || null;

          if (scanFlow === 'repo') {
            scanType = 'code';
            targetHost = null;
          } else if (scanFlow === 'tls') {
            scanType = 'tls';
            targetRepo = null;
          } else {
            scanType = 'full';
          }

          setLoadingStep('Executing cryptographic AST & network discovery...');

          const res = await fetch('/api/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              host: targetHost,
              port: parseInt(port) || 443,
              repo: targetRepo,
              scenario,
              scan_type: scanType,
              deep: deepTls,
              ignore_comments: ignoreComments,
              quantum_only: quantumOnly
            })
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || `HTTP ${res.status} scan failure`);
          }

          setLoadingStep('Computing Mosca theorem & risk assessments...');
          setScanData(data);
          loadHistory();

          // Auto-navigate to findings matrix if scan succeeded
          setCurrentView('matrix');
        } catch (err) {
          console.error('Scan error:', err);
          setErrorMessage(err.message || 'Scan execution encountered an error.');
        } finally {
          setLoading(false);
          setLoadingStep('');
        }
      };

      // Load Demo Data
      const handleLoadDemo = async () => {
        setLoading(true);
        setErrorMessage(null);
        try {
          const res = await fetch('/api/demo');
          const data = await res.json();
          setScanData(data);
          if (data.metadata?.targets?.host) setHost(data.metadata.targets.host);
          if (data.metadata?.targets?.repo) setRepo(data.metadata.targets.repo);
          loadHistory();
        } catch (err) {
          console.error('Failed to load demo data:', err);
          setErrorMessage('Could not load demo dataset. Ensure dashboard server is running.');
        } finally {
          setLoading(false);
        }
      };

      // Load scan from history
      const handleLoadHistoryItem = async (scanId) => {
        setLoading(true);
        setErrorMessage(null);
        try {
          const res = await fetch(`/api/history/${scanId}`);
          if (!res.ok) throw new Error('Failed to retrieve past scan.');
          const data = await res.json();
          setScanData(data);
          setCurrentView('matrix');
        } catch (err) {
          setErrorMessage(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Run Before/After Comparison
      const handleRunComparison = async () => {
        if (!compareBaselineId || !compareTargetId) {
          alert('Please select both a Baseline Scan and a Comparison Scan to analyze posture delta.');
          return;
        }
        if (compareBaselineId === compareTargetId) {
          alert('Baseline and Comparison scans must be different audit runs.');
          return;
        }

        setComparing(true);
        try {
          const res = await fetch('/api/compare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseline_id: compareBaselineId,
              comparison_id: compareTargetId
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Comparison calculation failed.');
          setComparisonResult(data);
        } catch (err) {
          alert(err.message);
        } finally {
          setComparing(false);
        }
      };

      // Export report (JSON or Markdown)
      const handleExport = (format) => {
        if (!scanData) return;
        const scanId = scanData.metadata?.scan_id || '';
        window.open(`/api/export?format=${format}&id=${scanId}`, '_blank');
      };

      // Index of raw inventory findings for fast lookup
      const inventoryMap = useMemo(() => {
        const map = {};
        (scanData?.inventory?.findings || []).forEach(f => {
          map[f.id] = f;
        });
        return map;
      }, [scanData]);

      // Filtered Risk Assessments for Matrix View
      const assessments = scanData?.risk_assessment?.assessments || [];
      const filteredAssessments = useMemo(() => {
        return assessments.filter(a => {
          // Track Filter
          if (matrixTab === 'quantum' && a.track !== 'quantum') return false;
          if (matrixTab === 'conventional' && a.track !== 'conventional') return false;

          // Severity Filter
          if (sevFilter !== 'all' && a.severity?.toLowerCase() !== sevFilter.toLowerCase()) return false;

          // Confidence Filter
          if (confFilter !== 'all' && a.confidence?.toLowerCase() !== confFilter.toLowerCase()) return false;

          // Free text search
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const inv = inventoryMap[a.finding_id] || {};
            const matchTitle = (a.title || '').toLowerCase().includes(q);
            const matchAsset = (a.asset || '').toLowerCase().includes(q);
            const matchAlgo = (a.algorithm || '').toLowerCase().includes(q);
            const matchAction = (a.recommendation?.action || '').toLowerCase().includes(q);
            const matchPurpose = (inv.attributes?.likely_purpose || '').toLowerCase().includes(q);
            if (!matchTitle && !matchAsset && !matchAlgo && !matchAction && !matchPurpose) return false;
          }
          return true;
        });
      }, [assessments, matrixTab, sevFilter, confFilter, searchQuery, inventoryMap]);

      // Backend metrics
      const summary = scanData?.risk_assessment?.summary || {};
      const sevCounts = summary.severity || { critical: 0, high: 0, medium: 0, low: 0, info: 0 };
      const trackCounts = summary.track || { quantum: 0, conventional: 0 };
      const totalAssessments = summary.total_assessments || 0;
      const totalInventory = scanData?.inventory?.total_items || 0;

      // Group assessments for Migration Roadmap
      const roadmapPhases = useMemo(() => {
        const p1 = []; // Immediate: Critical conventional or urgent quantum
        const p2 = []; // Near-term: High severity, hybrid key exchanges, certificate renewals
        const p3 = []; // Planned: Medium severity, NIST FIPS 203/204 standard transition
        const p4 = []; // Roadmap/Monitor: Low / info, agility framework

        assessments.forEach(a => {
          const tf = (a.recommendation?.timeframe || '').toLowerCase();
          const sev = (a.severity || '').toLowerCase();
          if (tf === 'immediate' || sev === 'critical') {
            p1.push(a);
          } else if (tf === 'near_term' || sev === 'high') {
            p2.push(a);
          } else if (tf === 'planned' || sev === 'medium') {
            p3.push(a);
          } else {
            p4.push(a);
          }
        });
        return { p1, p2, p3, p4 };
      }, [assessments]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Top Enterprise Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Product Identity */}
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-sky-500 flex items-center justify-center shadow-lg shadow-teal-500/20">
                  <span className="text-xl">🛡️</span>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-lg font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-teal-400 via-sky-400 to-teal-200">
                      Q-SHIELD
                    </span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30">
                      v2.0 Orchestrator
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    Defensible Cryptographic Post-Quantum Migration & Risk Audit
                  </p>
                </div>
              </div>

              {/* Status Indicator & Export Actions */}
              <div className="flex items-center space-x-3">
                <div className="hidden lg:flex items-center space-x-2 text-xs bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-300 font-mono">Engine: Active</span>
                  <span className="text-slate-600">|</span>
                  <span className="text-slate-400 font-mono">CRQC Horizon: {scanData?.metadata?.crqc_horizon_years || 15}y</span>
                </div>

                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => handleExport('json')}
                    disabled={!scanData}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition flex items-center space-x-1.5 disabled:opacity-40"
                    title="Export structured scan JSON"
                  >
                    <span>📥</span>
                    <span className="hidden sm:inline">JSON</span>
                  </button>
                  <button
                    onClick={() => handleExport('markdown')}
                    disabled={!scanData}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition flex items-center space-x-1.5 disabled:opacity-40"
                    title="Export Markdown audit report"
                  >
                    <span>📝</span>
                    <span className="hidden sm:inline">Report</span>
                  </button>
                  <button
                    onClick={handleLoadDemo}
                    disabled={loading}
                    className="px-3 py-1.5 bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 text-xs font-semibold rounded-lg transition"
                  >
                    Demo
                  </button>
                </div>
              </div>
            </div>

            {/* Global Feature Navigation Bar */}
            <div className="bg-slate-950/90 border-t border-slate-800/80">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <nav className="flex space-x-1 sm:space-x-4 overflow-x-auto py-1">
                  <button
                    onClick={() => setCurrentView('scanners')}
                    className={`py-2 px-3 text-xs font-semibold rounded-lg transition flex items-center space-x-2 whitespace-nowrap ${
                      currentView === 'scanners'
                        ? 'bg-teal-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <span>⚡</span>
                    <span>Scan Console</span>
                  </button>

                  <button
                    onClick={() => setCurrentView('matrix')}
                    className={`py-2 px-3 text-xs font-semibold rounded-lg transition flex items-center space-x-2 whitespace-nowrap ${
                      currentView === 'matrix'
                        ? 'bg-teal-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <span>📋</span>
                    <span>Risk Matrix & Findings</span>
                    <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-300 font-mono">
                      {totalAssessments}
                    </span>
                  </button>

                  <button
                    onClick={() => setCurrentView('cbom')}
                    className={`py-2 px-3 text-xs font-semibold rounded-lg transition flex items-center space-x-2 whitespace-nowrap ${
                      currentView === 'cbom'
                        ? 'bg-teal-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <span>📦</span>
                    <span>Cryptographic Inventory (CBOM)</span>
                    <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-300 font-mono">
                      {totalInventory}
                    </span>
                  </button>

                  <button
                    onClick={() => setCurrentView('roadmap')}
                    className={`py-2 px-3 text-xs font-semibold rounded-lg transition flex items-center space-x-2 whitespace-nowrap ${
                      currentView === 'roadmap'
                        ? 'bg-teal-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <span>🗺️</span>
                    <span>PQC Migration Roadmap</span>
                  </button>

                  <button
                    onClick={() => { setCurrentView('history'); loadHistory(); }}
                    className={`py-2 px-3 text-xs font-semibold rounded-lg transition flex items-center space-x-2 whitespace-nowrap ${
                      currentView === 'history'
                        ? 'bg-teal-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <span>📊</span>
                    <span>Audit History & Comparison</span>
                    {scanHistory.length > 0 && (
                      <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-300 font-mono">
                        {scanHistory.length}
                      </span>
                    )}
                  </button>
                </nav>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            {/* Operational Error Alert Banner */}
            {errorMessage && (
              <div className="bg-red-500/10 border border-red-500/40 rounded-xl p-4 text-xs text-red-200 flex items-start justify-between shadow-lg">
                <div className="flex items-start space-x-2.5">
                  <span className="text-base text-red-400">⚠️</span>
                  <div>
                    <strong className="text-red-300 block font-semibold">Target Validation or Scan Error</strong>
                    <span>{errorMessage}</span>
                  </div>
                </div>
                <button onClick={() => setErrorMessage(null)} className="text-red-400 hover:text-white font-bold px-2">✕</button>
              </div>
            )}

            {/* Handled Backend Warning Banner (Network warnings / graceful degradation) */}
            {scanData?.metadata?.errors?.length > 0 && (
              <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-xs text-amber-200 space-y-1.5 shadow-md">
                <div className="font-bold flex items-center space-x-2 text-amber-400">
                  <span>⚠️</span>
                  <span>Handled Diagnostic Warnings During Scan:</span>
                </div>
                <div className="pl-6 space-y-1">
                  {scanData.metadata.errors.map((err, i) => (
                    <div key={i} className="text-amber-300/90 font-mono text-[11px]">
                      [{err.module}] {err.error}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Scan Executive KPI Strip (Always visible when scan data exists) */}
            {scanData && (
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                {/* Metric 1: Total Assessments */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between">
                  <span className="text-[11px] font-semibold text-slate-400">Total Assessed Risks</span>
                  <div className="my-1.5 text-2xl font-black text-slate-100">{totalAssessments}</div>
                  <span className="text-[10px] text-slate-500 font-mono">{totalInventory} primitives inventoried</span>
                </div>

                {/* Metric 2: Critical / High Risks */}
                <div className="bg-slate-900 border border-red-900/40 rounded-xl p-3.5 flex flex-col justify-between">
                  <span className="text-[11px] font-semibold text-red-400">Critical & High Flaws</span>
                  <div className="my-1.5 text-2xl font-black text-red-400">
                    {(sevCounts.critical || 0) + (sevCounts.high || 0)}
                  </div>
                  <span className="text-[10px] text-red-300/80 font-mono">
                    {sevCounts.critical || 0} Critical | {sevCounts.high || 0} High
                  </span>
                </div>

                {/* Metric 3: Track A: Post-Quantum */}
                <div className="bg-slate-900 border border-sky-900/40 rounded-xl p-3.5 flex flex-col justify-between">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-semibold text-sky-400">Track A: Post-Quantum</span>
                    <span className="text-[9px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono">Shor/Grover</span>
                  </div>
                  <div className="my-1.5 text-2xl font-black text-sky-400">{trackCounts.quantum || 0}</div>
                  <span className="text-[10px] text-slate-400">Requires NIST FIPS 203/204</span>
                </div>

                {/* Metric 4: Track B: Conventional */}
                <div className="bg-slate-900 border border-amber-900/40 rounded-xl p-3.5 flex flex-col justify-between">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-semibold text-amber-400">Track B: Conventional</span>
                    <span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono">Classical</span>
                  </div>
                  <div className="my-1.5 text-2xl font-black text-amber-400">{trackCounts.conventional || 0}</div>
                  <span className="text-[10px] text-slate-400">MD5, SHA-1, DES, Weak Passwords</span>
                </div>

                {/* Metric 5: CRQC Horizon */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between col-span-2 md:col-span-1">
                  <span className="text-[11px] font-semibold text-teal-400">Planning Horizon</span>
                  <div className="my-1.5 text-2xl font-black text-teal-300">
                    {scanData.metadata?.crqc_horizon_years || 15}y
                  </div>
                  <span className="text-[10px] text-slate-400 capitalize">
                    {scanData.metadata?.scenario || 'Central'} Scenario
                  </span>
                </div>
              </div>
            )}

            {/* ================================================================ */}
            {/* VIEW 1: SCAN CONSOLE (Priority 1 & 2: Dedicated Scan Flows) */}
            {/* ================================================================ */}
            {currentView === 'scanners' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                  {/* Flow Mode Selector Tabs */}
                  <div className="border-b border-slate-800 pb-4 mb-6">
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h2 className="text-base font-bold text-slate-100 flex items-center space-x-2">
                          <span>🎯</span>
                          <span>Authorized Cryptographic Target Inspection</span>
                        </h2>
                        <p className="text-xs text-slate-400">

                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Defensible, phased transition plan derived from Mosca's Theorem (<code className="text-teal-300 font-mono">X + Y vs Z</code>) and real scan findings.
                  </p>
                </div>

                {/* NIST Reference Standards Guidance Card */}
                <div className="bg-slate-900 border border-teal-500/30 rounded-xl p-5 space-y-3 shadow-xl">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-400 flex items-center space-x-2">
                    <span>🏛️</span>
                    <span>Standardized Post-Quantum Target Cryptographic Primitives</span>
                  </span>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <span className="text-sky-400 font-bold block">NIST FIPS 203 (ML-KEM)</span>
                      <p className="text-slate-400 text-[11px] mt-1">Module-Lattice Key Encapsulation (Kyber) for general encryption & key agreement.</p>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <span className="text-sky-400 font-bold block">NIST FIPS 204 (ML-DSA)</span>
                      <p className="text-slate-400 text-[11px] mt-1">Module-Lattice Digital Signatures (Dilithium) for general digital signatures.</p>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <span className="text-sky-400 font-bold block">NIST FIPS 205 (SLH-DSA)</span>
                      <p className="text-slate-400 text-[11px] mt-1">Stateless Hash-based Signatures (SPHINCS+) as a non-lattice security fallback.</p>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <span className="text-amber-400 font-bold block">RFC 9106 (Argon2id)</span>
                      <p className="text-slate-400 text-[11px] mt-1">Memory-hard password hashing. Conventional security; NOT solved by PQC.</p>
                    </div>
                  </div>
                </div>

                {/* 4 Phases derived from real findings */}
                <div className="space-y-4">
                  {/* Phase 1 */}
                  <div className="bg-slate-900 border border-red-500/40 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-red-400 flex items-center space-x-2">
                          <span>🔴</span>
                          <span>Phase 1: Immediate Remediation (Critical Findings)</span>
                        </span>
                        <p className="text-[11px] text-slate-400">Broken classical cryptography and immediate quantum exposure.</p>
                      </div>
                      <span className="text-xs font-mono px-2 py-0.5 rounded bg-red-500/20 text-red-300 font-bold">
                        {roadmapPhases.p1.length} Items
                      </span>
                    </div>

                    {roadmapPhases.p1.length === 0 ? (
                      <p className="text-xs text-slate-500 py-2">✓ No critical immediate-action risks detected.</p>
                    ) : (
                      <div className="space-y-2">
                        {roadmapPhases.p1.map((a, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs flex flex-col md:flex-row md:items-center justify-between gap-2">
                            <div>
                              <strong className="text-slate-200 block">{a.title}</strong>
                              <span className="text-slate-400 font-mono text-[11px]">Asset: {a.asset} • Algo: {a.algorithm}</span>
                            </div>
                            <div className="text-right">
                              <span className="text-teal-400 block font-semibold">{a.recommendation?.action}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Phase 2 */}
                  <div className="bg-slate-900 border border-orange-500/40 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-orange-400 flex items-center space-x-2">
                          <span>🟠</span>
                          <span>Phase 2: Near-Term PQC Hybrid Transition</span>
                        </span>
                        <p className="text-[11px] text-slate-400">Implement hybrid key exchange (e.g. X25519MLKEM768) and review TLS cert lifecycle.</p>
                      </div>
                      <span className="text-xs font-mono px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 font-bold">
                        {roadmapPhases.p2.length} Items
                      </span>
                    </div>

                    {roadmapPhases.p2.length === 0 ? (
                      <p className="text-xs text-slate-500 py-2">✓ No near-term phase 2 findings.</p>
                    ) : (
                      <div className="space-y-2">
                        {roadmapPhases.p2.map((a, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs flex flex-col md:flex-row md:items-center justify-between gap-2">
                            <div>
                              <strong className="text-slate-200 block">{a.title}</strong>
                              <span className="text-slate-400 font-mono text-[11px]">Asset: {a.asset} • Algo: {a.algorithm}</span>
                            </div>
                            <div className="text-right">
                              <span className="text-teal-400 block font-semibold">{a.recommendation?.action}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Phase 3 */}
                  <div className="bg-slate-900 border border-sky-500/40 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-sky-400 flex items-center space-x-2">
                          <span>🔵</span>
                          <span>Phase 3: Planned Post-Quantum Standard Transition</span>
                        </span>
                        <p className="text-[11px] text-slate-400">Migrate asymmetric signatures to ML-DSA / SLH-DSA within planning horizon.</p>
                      </div>
                      <span className="text-xs font-mono px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-bold">
                        {roadmapPhases.p3.length} Items
                      </span>
                    </div>

                    {roadmapPhases.p3.length === 0 ? (
                      <p className="text-xs text-slate-500 py-2">✓ No phase 3 migration findings.</p>
                    ) : (
                      <div className="space-y-2">
                        {roadmapPhases.p3.map((a, i) => (
                          <div key={i} className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs flex flex-col md:flex-row md:items-center justify-between gap-2">
                            <div>
                              <strong className="text-slate-200 block">{a.title}</strong>
                              <span className="text-slate-400 font-mono text-[11px]">Asset: {a.asset} • Algo: {a.algorithm}</span>
                            </div>
                            <div className="text-right">
                              <span className="text-teal-400 block font-semibold">{a.recommendation?.action}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ================================================================ */}
            {/* VIEW 5: SCAN HISTORY & BEFORE/AFTER COMPARISON (Priority 5 & 6) */}
            {/* ================================================================ */}
            {currentView === 'history' && (
              <div className="space-y-6">
                {/* History Session Audit Log Table */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-slate-100 flex items-center space-x-2">
                        <span>📊</span>
                        <span>Audit Scan History</span>
                      </h2>
                      <p className="text-xs text-slate-400">
                        Reliable audit record of scans executed during this session.
                      </p>
                    </div>
                    <button
                      onClick={loadHistory}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold"
                    >
                      Refresh
                    </button>
                  </div>

                  {scanHistory.length === 0 ? (
                    <div className="p-8 text-center text-slate-500 bg-slate-950 rounded-xl border border-slate-800">
                      No past scans recorded yet. Execute a scan or load demo data to begin recording audit history.
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-950 text-slate-400 font-mono uppercase text-[10px] border-b border-slate-800">
                          <tr>
                            <th className="p-3">Scan ID</th>
                            <th className="p-3">Timestamp</th>
                            <th className="p-3">Target</th>
                            <th className="p-3">Flow</th>
                            <th className="p-3">Duration</th>
                            <th className="p-3">Total Risks</th>
                            <th className="p-3">Critical / High</th>
                            <th className="p-3">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/80 text-slate-300">
                          {scanHistory.map((h) => (
                            <tr key={h.id} className="hover:bg-slate-850/50 transition">
                              <td className="p-3 font-mono text-teal-300">{h.id}</td>
                              <td className="p-3 font-mono text-slate-400">{h.timestamp?.slice(0, 19).replace('T', ' ')}</td>
                              <td className="p-3 font-medium text-slate-100">{h.target_label}</td>
                              <td className="p-3 font-mono uppercase text-[10px] text-slate-400">{h.flow_type}</td>
                              <td className="p-3 font-mono text-slate-400">{h.duration_seconds}s</td>
                              <td className="p-3 font-bold text-slate-200">{h.total_assessments}</td>
                              <td className="p-3 font-mono text-red-400">
                                {(h.severity_counts?.critical || 0) + (h.severity_counts?.high || 0)}
                              </td>
                              <td className="p-3 space-x-2">
                                <button
                                  onClick={() => handleLoadHistoryItem(h.id)}
                                  className="text-teal-400 hover:underline font-semibold"
                                >
                                  Load
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* Before / After Comparison Tool */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl space-y-5">
                  <div className="border-b border-slate-800 pb-3">
                    <h3 className="text-sm font-bold text-slate-100 flex items-center space-x-2">
                      <span>⚖️</span>
                      <span>Before / After Cryptographic Posture Comparison</span>
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Mathematically verify remediation progress between two real scans (e.g. baseline scan vs post-migration scan).
                    </p>
                  </div>

                  {scanHistory.length < 2 ? (
                    <div className="p-8 text-center text-slate-500 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                      Comparison requires at least two scans in history. Run another scan or re-scan an authorized target to compare before/after posture.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-1.5">
                          <label className="text-xs font-semibold text-slate-300">Baseline Scan (Before):</label>
                          <select
                            value={compareBaselineId}
                            onChange={(e) => setCompareBaselineId(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500"
                          >
                            <option value="">Select baseline scan...</option>
                            {scanHistory.map(h => (
                              <option key={h.id} value={h.id}>
                                {h.id} - {h.target_label} ({h.total_assessments} risks)
                              </option>
                            ))}
                          </select>
                        </div>

                        <div className="space-y-1.5">
                          <label className="text-xs font-semibold text-slate-300">Comparison Scan (After / Current):</label>
                          <select
                            value={compareTargetId}
                            onChange={(e) => setCompareTargetId(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500"
                          >
                            <option value="">Select comparison scan...</option>
                            {scanHistory.map(h => (
                              <option key={h.id} value={h.id}>
                                {h.id} - {h.target_label} ({h.total_assessments} risks)
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="flex justify-end">
                        <button
                          type="button"
                          onClick={handleRunComparison}
                          disabled={comparing || !compareBaselineId || !compareTargetId}
                          className="px-5 py-2 bg-gradient-to-r from-teal-500 to-sky-500 text-white text-xs font-bold rounded-lg shadow-md transition disabled:opacity-40"
                        >
                          {comparing ? 'Analyzing Posture Delta...' : 'Run Differential Comparison'}
                        </button>
                      </div>

                      {/* Comparison Results Card */}
                      {comparisonResult && (
                        <div className="mt-4 p-5 bg-slate-950 rounded-xl border border-slate-800 space-y-4">
                          {/* Status Banner */}
                          <div className={`p-3.5 rounded-lg border text-xs flex items-center justify-between ${
                            comparisonResult.status === 'improved'
                              ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/40'
                              : (comparisonResult.status === 'degraded' ? 'bg-red-500/10 text-red-300 border-red-500/40' : 'bg-slate-800 text-slate-300 border-slate-700')
                          }`}>
                            <div className="flex items-center space-x-2 font-bold">
                              <span>{comparisonResult.status === 'improved' ? '✓' : (comparisonResult.status === 'degraded' ? '⚠️' : 'ℹ️')}</span>
                              <span className="uppercase tracking-wider">{comparisonResult.status}:</span>
                              <span>{comparisonResult.status_note}</span>
                            </div>
                          </div>

                          {/* Delta Metric Summary */}
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs font-mono">
                            <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                              <span className="text-slate-400 block text-[10px]">TOTAL RISKS DELTA</span>
                              <span className={`text-xl font-bold ${comparisonResult.deltas.total_assessments <= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                {comparisonResult.deltas.total_assessments > 0 ? `+${comparisonResult.deltas.total_assessments}` : comparisonResult.deltas.total_assessments}
                              </span>
                            </div>
                            <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                              <span className="text-slate-400 block text-[10px]">CRITICAL DELTA</span>
                              <span className={`text-xl font-bold ${comparisonResult.deltas.severity.critical <= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                {comparisonResult.deltas.severity.critical > 0 ? `+${comparisonResult.deltas.severity.critical}` : comparisonResult.deltas.severity.critical}
                              </span>
                            </div>
                            <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                              <span className="text-slate-400 block text-[10px]">RESOLVED FINDINGS</span>
                              <span className="text-xl font-bold text-emerald-400">
                                {comparisonResult.resolved_findings.length}
                              </span>
                            </div>
                            <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                              <span className="text-slate-400 block text-[10px]">NEW RISKS DETECTED</span>
                              <span className={`text-xl font-bold ${comparisonResult.new_findings.length === 0 ? 'text-slate-400' : 'text-red-400'}`}>
                                {comparisonResult.new_findings.length}
                              </span>
                            </div>
                          </div>

                          {/* Resolved Items List */}
                          {comparisonResult.resolved_findings.length > 0 && (
                            <div className="space-y-2 pt-2">
                              <h4 className="text-xs font-bold text-emerald-400 flex items-center space-x-1.5">
                                <span>✓</span>
                                <span>Remediated Cryptographic Risks ({comparisonResult.resolved_findings.length}):</span>
                              </h4>
                              <div className="space-y-1.5">
                                {comparisonResult.resolved_findings.map((rf, idx) => (
                                  <div key={idx} className="bg-slate-900 p-2.5 rounded border border-emerald-500/30 text-xs flex justify-between">
                                    <span className="text-slate-200">{rf.title}</span>
                                    <code className="text-emerald-300 font-mono text-[11px]">{rf.algorithm}</code>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* ================================================================ */}
          {/* DETAILED FINDING INSPECTOR MODAL / DRAWER (Priority 3) */}
          {/* ================================================================ */}
          {selectedFinding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-5 shadow-2xl">
                {/* Modal Header */}
                <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div className="space-y-1.5">
                    <div className="flex items-center space-x-2">
                      <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${SEVERITY_CONFIG[selectedFinding.severity?.toLowerCase()]?.badge || 'bg-slate-700'}`}>
                        {selectedFinding.severity}
                      </span>
                      <span className="text-[10px] font-mono text-slate-400">
                        Priority: <strong className="text-teal-300">{selectedFinding.priority?.toFixed(1)}/100</strong>
                      </span>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded-full border border-slate-700 bg-slate-800 text-slate-300">
                        Confidence: <strong className="uppercase text-slate-200">{selectedFinding.confidence}</strong>
                      </span>
                    </div>
                    <h3 className="text-base font-bold text-slate-100">{selectedFinding.title}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedFinding(null)}
                    className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Body */}
                <div className="space-y-4 text-xs">
                  {/* Asset & Algorithm Metadata */}
                  <div className="grid grid-cols-2 gap-3 p-3 bg-slate-950 rounded-lg border border-slate-800 font-mono">
                    <div>
                      <span className="text-slate-500 block text-[10px]">TARGET ASSET:</span>
                      <span className="text-slate-200 font-bold">{selectedFinding.asset}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block text-[10px]">DETECTED ALGORITHM:</span>
                      <span className="text-teal-400 font-bold">{selectedFinding.algorithm}</span>
                    </div>
                  </div>

                  {/* Confidence Rationale */}
                  {selectedFinding.confidence_rationale && (
                    <div className="space-y-1">
                      <span className="font-semibold text-slate-400">Evidence Provenance & Confidence Calculation:</span>
                      <p className="text-slate-300 bg-slate-950 p-2.5 rounded border border-slate-800/80 font-mono text-[11px]">
                        {selectedFinding.confidence_rationale}
                      </p>
                    </div>
                  )}

                  {/* Cryptographic Rationale */}
                  <div className="space-y-1">
                    <span className="font-semibold text-slate-300">Cryptographic Vulnerability Rationale:</span>
                    <p className="text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 leading-relaxed">
                      {selectedFinding.rationale}
                    </p>
                  </div>

                  {/* Quantum vs Conventional Separation */}
                  <div className="space-y-1">
                    <span className="font-semibold text-slate-300">Track & Quantum Relevance:</span>
                    <p className="text-slate-400 bg-slate-950/60 p-2.5 rounded border border-slate-800 text-[11px]">
                      {selectedFinding.quantum_relevance}
                    </p>
                  </div>

                  {/* Mosca Theorem Details */}
                  {selectedFinding.threat_analysis?.details && (
                    <div className="space-y-1">
                      <span className="font-semibold text-slate-300">Threat Model & Mosca Horizon Analysis:</span>
                      <p className="text-slate-400 bg-slate-950/60 p-2.5 rounded border border-slate-800 font-mono text-[11px]">
                        {selectedFinding.threat_analysis.details}
                      </p>
                    </div>
                  )}

                  {/* Recommendation Card */}
                  <div className="space-y-2 p-4 bg-teal-500/10 border border-teal-500/30 rounded-xl text-teal-200">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-teal-400 text-xs uppercase tracking-wider">
                        Action Required ({selectedFinding.recommendation?.timeframe?.toUpperCase()}):
                      </span>
                      <span className="px-2 py-0.5 rounded bg-teal-500/20 text-teal-300 text-[10px] font-mono">
                        NIST Standardized
                      </span>
                    </div>
                    <p className="font-medium text-slate-100 text-sm">
                      {selectedFinding.recommendation?.action}
                    </p>
                    <p className="text-slate-300 text-xs">
                      <b>Technical Justification:</b> {selectedFinding.recommendation?.reason}
                    </p>
                    {selectedFinding.recommendation?.alternatives?.length > 0 && (
                      <div className="pt-2 border-t border-teal-500/20">
                        <span className="text-[11px] font-semibold text-teal-400 block mb-1">Standardized Alternatives:</span>
                        <div className="flex flex-wrap gap-1.5">
                          {selectedFinding.recommendation.alternatives.map((alt, i) => (
                            <span key={i} className="px-2 py-0.5 rounded bg-slate-950 text-teal-300 font-mono text-[10px] border border-teal-500/30">
                              {alt}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setSelectedFinding(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
